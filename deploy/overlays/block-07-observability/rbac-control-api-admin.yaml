# RBAC für die neuen Admin-Endpoints in control-api.
#
# Wichtig: passt den ServiceAccount-Namen an den an, unter dem euer
# control-api-Deployment tatsächlich läuft — prüfen mit:
#   kubectl -n food-delivery get deployment control-api -o jsonpath='{.spec.template.spec.serviceAccountName}'
# Falls das leer/"default" ist, entweder den ServiceAccount unten
# "control-api" nennen UND im Deployment eintragen, oder hier den
# Namen auf "default" ändern (weniger sauber, aber funktioniert).
#
# Anwenden:
#   kubectl -n food-delivery apply -f rbac-control-api-admin.yaml
#   kubectl -n food-delivery rollout restart deployment/control-api
#
# Zusätzlich im control-api-Deployment die Downward-API-Env-Variable
# ergänzen, falls noch nicht vorhanden (wird von cluster.NewInCluster
# gebraucht):
#   env:
#     - name: POD_NAMESPACE
#       valueFrom:
#         fieldRef:
#           fieldPath: metadata.namespace

apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-api
  namespace: food-delivery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-api-admin
  namespace: food-delivery
rules:
  # Lese-Rechte, wie sie observer.go vermutlich schon nutzt
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  # Neu für die Admin-Endpoints
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-api-admin
  namespace: food-delivery
subjects:
  - kind: ServiceAccount
    name: control-api
    namespace: food-delivery
roleRef:
  kind: Role
  name: control-api-admin
  apiGroup: rbac.authorization.k8s.io
